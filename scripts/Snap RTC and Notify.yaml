blueprint:
  name: SGScript - Snap RTC & Notify
  description: >
    Downloads a snapshot from a given URL to a subdirectory inside
    `www/downloader/snaps_<subdir>`, then sends a notification with optional
    title, message, image, click action, timeout, notification channel,
    importance, and notification actions.

    For Android alarm-style notifications, set the channel to
    `alarm_stream`. This automatically adds `ttl: 0` and `priority: high`.
  domain: script

  input:
    subdir:
      name: "Subdirectory"
      description: "You can think of this as a UUID for the camera, to generate an obfuscated URL for the image."
      selector:
        object:

    initial_delay:
      name: "Initial delay"
      description: "Delay in seconds before grabbing a snapshot (default: 2s)"
      default: 2
      selector:
        number:
          min: 0
          max: 30
          unit_of_measurement: s
          mode: slider

    snap_url:
      name: "Snapshot URL"
      description: "URL to the snapshot image (e.g., the frame url from go2rtc's API)"
      selector:
        object:

    notify_title:
      name: "Notification Title"
      description: "Title of the notification"
      default: "Snapshot"
      selector:
        object:

    notify_message:
      name: "Notification Message"
      description: "Message to include in the notification (can be left blank)"
      default: [ ]
      selector:
        object:

    downloader_delay:
      name: "Downloader delay"
      description: "Delay in seconds between downloading and sending the notification (default: 0.2s)"
      default: 0.2
      selector:
        number:
          min: 0
          max: 2
          unit_of_measurement: s
          mode: slider

    notify_target:
      name: "Notification Target"
      description: "Notify service to use (e.g., notify.mobile_app_your_phone). Defaults to notify.everything."
      default: "notify.everything"
      selector:
        object:

    click_action:
      name: "Click Action"
      description: "URL or action to open when the notification is clicked (optional)"
      default: [ ]
      selector:
        object:

    timeout:
      name: "Notification Timeout"
      description: "Time in seconds before the notification disappears (leave blank for no timeout)"
      default: ""
      selector:
        number:
          min: 0
          max: 3600
          mode: box
          unit_of_measurement: s

    channel:
      name: "Notification Channel"
      description: >
        Android notification channel to use. Defaults to Snapshot.
        Select alarm_stream for an alarm-style notification. When
        alarm_stream is selected, ttl: 0 and priority: high are added
        automatically.
      default: "Snapshot"
      selector:
        select:
          options:
            - label: "Snapshot"
              value: "Snapshot"
            - label: "Alarm Stream"
              value: "alarm_stream"
          custom_value: true
          mode: dropdown

    importance:
      name: "Notification Importance"
      description: >
        Android notification channel importance. Maximum is the highest
        available importance level.
      default: "high"
      selector:
        select:
          options:
            - label: "Minimum"
              value: "min"
            - label: "Low"
              value: "low"
            - label: "Default"
              value: "default"
            - label: "High"
              value: "high"
            - label: "Maximum"
              value: "max"
          mode: dropdown

    notify_actions:
      name: "Notification Actions"
      description: |
        List of action/title pairs to include in the notification

        Example:

        ```yaml
        - action: SET_DND
          title: Set to DND
        ```
      default: [ ]
      selector:
        object:

variables:
  ts: "{{ now().strftime('%d-%m-%Hh-%Mm-%Ss') }}"
  subdir: !input subdir
  snap_url: !input snap_url
  notify_message: !input notify_message
  notify_title: !input notify_title
  initial_delay_s: !input initial_delay
  downloader_delay_s: !input downloader_delay
  notify_target: !input notify_target
  click_action: !input click_action
  timeout: !input timeout
  channel: !input channel
  importance: !input importance
  notify_actions: !input notify_actions

  initial_delay_ms: "{{ (initial_delay_s * 1000) | round(0) }}"
  downloader_delay_ms: "{{ (downloader_delay_s * 1000) | round(0) }}"

sequence:
  - delay:
      milliseconds: "{{ initial_delay_ms }}"

  - service: downloader.download_file
    data:
      url: "{{ snap_url }}"
      subdir: "snaps_{{ subdir }}"
      overwrite: true
      filename: "snap_{{ ts }}.jpg"

  - delay:
      milliseconds: "{{ downloader_delay_ms }}"

  - service: "{{ notify_target }}"
    data:
      message: "{{ notify_message }} - {{ now().strftime('%H:%M') }}"
      title: "{{ notify_title }}"
      data:
        image: "/local/downloader/snaps_{{ subdir }}/snap_{{ ts }}.jpg"
        clickAction: "{{ click_action }}"
        timeout: "{{ timeout }}"
        actions: "{{ notify_actions }}"
        channel: "{{ channel }}"
        importance: "{{ importance }}"
        visibility: public
        car_ui: true

        # Android alarm-stream notifications need these values.
        # They are omitted entirely for normal notifications.
        {% if channel == 'alarm_stream' %}
        ttl: 0
        priority: high
        {% endif %}

mode: single
