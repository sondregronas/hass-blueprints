blueprint:
  name: SGScript - Snap RTC & Notify
  description: >
    Downloads a snapshot from a given URL to a subdirectory inside
    `www/downloader/snaps_<subdir>`, then sends a notification with optional
    title, message, image, click action, timeout, channel, importance,
    vibration pattern, and notification actions.

    The channel controls which Android notification channel is used.
    Security and alarm_stream have distinctive automatic vibration patterns.

    High and maximum importance request immediate notification delivery
    using priority high and ttl 0.

    The alarm_stream channel uses the Android alarm audio stream.
  domain: script

  input:
    subdir:
      name: "Subdirectory"
      description: >
        You can think of this as a UUID for the camera, to generate an
        obfuscated URL for the image.
      selector:
        object:

    initial_delay:
      name: "Initial delay"
      description: "Delay in seconds before grabbing a snapshot (default: 2s)"
      default: 2
      selector:
        number:
          min: 0
          max: 30
          unit_of_measurement: s
          mode: slider

    snap_url:
      name: "Snapshot URL"
      description: >
        URL to the snapshot image (e.g., the frame url from go2rtc's API)
      selector:
        object:

    notify_title:
      name: "Notification Title"
      description: "Title of the notification"
      default: "Snapshot"
      selector:
        object:

    notify_message:
      name: "Notification Message"
      description: >
        Message to include in the notification (can be left blank)
      default: [ ]
      selector:
        object:

    downloader_delay:
      name: "Downloader delay"
      description: >
        Delay in seconds between downloading and sending the notification
        (default: 0.2s)
      default: 0.2
      selector:
        number:
          min: 0
          max: 2
          unit_of_measurement: s
          mode: slider

    notify_target:
      name: "Notification Target"
      description: >
        Notify service to use (e.g., notify.mobile_app_your_phone).
        Defaults to notify.everything.
      default: "notify.everything"
      selector:
        object:

    click_action:
      name: "Click Action"
      description: >
        URL or action to open when the notification is clicked (optional)
      default: [ ]
      selector:
        object:

    timeout:
      name: "Notification Timeout"
      description: >
        Time in seconds before the notification disappears
        (leave blank for no timeout)
      default: ""
      selector:
        number:
          min: 0
          max: 3600
          mode: box
          unit_of_measurement: s

    channel:
      name: "Notification Channel"
      description: >
        Android notification channel to use.

        Snapshot is the normal channel.
        Security is intended for security-related events.
        Motion and Doorbell are separate channels that can be configured
        independently in Android.

        Alarm Stream uses the Android alarm audio stream and is intended
        for genuinely urgent notifications.
      default: "Snapshot"
      selector:
        select:
          options:
            - label: "Snapshot"
              value: "Snapshot"
            - label: "Security"
              value: "Security"
            - label: "Motion"
              value: "Motion"
            - label: "Doorbell"
              value: "Doorbell"
            - label: "Alarm Stream"
              value: "alarm_stream"
          mode: dropdown

    importance:
      name: "Notification Importance"
      description: >
        Android notification channel importance.

        High and Maximum request immediate notification delivery using
        priority high and ttl 0.
      default: "high"
      selector:
        select:
          options:
            - label: "Minimum"
              value: "min"
            - label: "Low"
              value: "low"
            - label: "Default"
              value: "default"
            - label: "High"
              value: "high"
            - label: "Maximum"
              value: "max"
          mode: dropdown

    vibration_pattern:
      name: "Vibration Pattern"
      description: >
        Select Auto to use a channel-specific vibration pattern.

        Security uses a distinctive double pulse.
        Alarm Stream uses a longer repeating alarm pattern.

        Custom patterns use milliseconds in alternating off/on order.
        Example: 100, 500, 100, 500
      default: "auto"
      selector:
        select:
          options:
            - label: "Auto"
              value: "auto"
            - label: "None"
              value: "none"
            - label: "Short"
              value: "100, 100"
            - label: "Double"
              value: "100, 500, 100, 500"
            - label: "Alarm"
              value: "100, 1000, 100, 1000, 100, 1000"
          mode: dropdown

    notify_actions:
      name: "Notification Actions"
      description: |
        List of action/title pairs to include in the notification

        Example:

        ```yaml
        - action: SET_DND
          title: Set to DND
        ```
      default: [ ]
      selector:
        object:

variables:
  ts: "{{ now().strftime('%d-%m-%Hh-%Mm-%Ss') }}"

  subdir: !input subdir
  snap_url: !input snap_url
  notify_message: !input notify_message
  notify_title: !input notify_title
  initial_delay_s: !input initial_delay
  downloader_delay_s: !input downloader_delay
  notify_target: !input notify_target
  click_action: !input click_action
  timeout: !input timeout
  channel: !input channel
  importance: !input importance
  vibration_pattern: !input vibration_pattern
  notify_actions: !input notify_actions

  initial_delay_ms: >
    {{ (initial_delay_s * 1000) | round(0) }}

  downloader_delay_ms: >
    {{ (downloader_delay_s * 1000) | round(0) }}

  notification_priority: >
    {{ 'high' if importance in ['high', 'max'] else none }}

  notification_ttl: >
    {{ 0 if importance in ['high', 'max'] else none }}

  vibration_pattern_value: >
    {% if vibration_pattern == 'auto' %}
      {% if channel in ['Security', 'alarm_stream'] %}
        100, 1000, 100, 1000, 100, 1000
      {% else %}
        none
      {% endif %}
    {% elif vibration_pattern == 'none' %}
      none
    {% else %}
      {{ vibration_pattern }}
    {% endif %}

sequence:
  - delay:
      milliseconds: "{{ initial_delay_ms }}"

  - service: downloader.download_file
    data:
      url: "{{ snap_url }}"
      subdir: "snaps_{{ subdir }}"
      overwrite: true
      filename: "snap_{{ ts }}.jpg"

  - delay:
      milliseconds: "{{ downloader_delay_ms }}"

  - service: "{{ notify_target }}"
    data:
      message: "{{ notify_message }} - {{ now().strftime('%H:%M') }}"
      title: "{{ notify_title }}"
      data:
        image: "/local/downloader/snaps_{{ subdir }}/snap_{{ ts }}.jpg"
        clickAction: "{{ click_action }}"
        timeout: "{{ timeout }}"
        actions: "{{ notify_actions }}"
        channel: "{{ channel }}"
        importance: "{{ importance }}"
        vibrationPattern: "{{ vibration_pattern_value }}"
        visibility: public
        car_ui: true
        priority: "{{ notification_priority }}"
        ttl: "{{ notification_ttl }}"

mode: single
