blueprint:
  name: SGDevice - Plejd WPH-01 Double
  description: |
    Blueprint to integrate the Plejd WPH-01 (double rocker) with Home Assistant.

    Button mapping (clockwise IDs):
      1 = left up
      2 = right up
      3 = left down
      4 = right down

    Default behavior (when no override action is provided):
      - Up: activate scene "scene.'area_friendly_name'_bright" for the configured side
      - Down: if any light in that area is on, turn off lights in that area; otherwise activate "scene.'area_friendly_name'_dim"

    Any press actions:
      - You can run extra actions on any press (any button), or per side (left/right), before the button-specific actions.
      - This is useful for things like toggling an input_boolean "deactivate motion lights", disabling/enabling other automations, etc.

    Double click:
      - Optional and disabled by default.
      - When enabled, this blueprint adds an intentional delay before running actions so it can decide between single and double click.
      - Detection is best-effort and may vary depending on the integration/event timing.

    IMPORTANT:
      - This blueprint identifies buttons by the event entity_id suffixes (_2, _3, _4).
      - Do not rename these event entities in Home Assistant, or make sure the name and suffixes are preserved.

    Note: This blueprint relies on the hass-plejd integration to create event entities for the button presses.

  domain: automation
  source_url: https://github.com/sondregronas/hass-blueprints/blob/main/devices/Plejd%20WPH-01%20Double.yaml

  input:
    switches:
      name: Plejd WPH-01 (double rocker)
      description: Select the Plejd WPH-01 device.
      selector:
        device:
          model: WPH-01-LC
          multiple: false

    left_area:
      name: Left area (optional)
      description: Area used by default actions for the left rocker.
      default: null
      selector:
        area: { }

    right_area:
      name: Right area (optional)
      description: Area used by default actions for the right rocker.
      default: null
      selector:
        area: { }

    cycle_scenes:
      name: Cycle scenes
      description: |
        When enabled, Up and Down step through the area's scenes in this order
        (missing scenes are skipped): dimmest, dimmer, dim, bright, brighter,
        brightest. Up from brightest wraps to bright, Down from dimmest turns
        the lights off. Enabled by default.
      default: true
      selector:
        boolean: { }

    scene_time_start:
      name: Scene daytime start
      description: Start of the daytime window used by the time-of-day options below.
      default: "08:00:00"
      selector:
        time: { }

    scene_time_end:
      name: Scene daytime end
      description: End of the daytime window used by the time-of-day options below.
      default: "21:00:00"
      selector:
        time: { }

    modify_bright_scenes_by_time:
      name: Modify bright scenes based on time of day
      description: When Up starts a cycle (lights off or no scene active), start at Brightest during the daytime window instead of Bright.
      default: false
      selector:
        boolean: { }

    modify_dim_scenes_by_time:
      name: Modify dim scenes based on time of day
      description: When Down starts a cycle (lights off or no scene active), start at Dimmest outside the daytime window instead of Dim.
      default: true
      selector:
        boolean: { }

    any_press_actions:
      name: Any press actions
      collapsed: true
      input:
        any_press:
          name: Any press
          description: |
            Runs on any press (any button), before side-specific and button-specific actions.

            Useful for things like toggling an input_boolean "deactivate motion lights", disabling/enabling other automations, etc.
          default: [ ]
          selector:
            action: { }

        left_any_press:
          name: Left rockers - any press
          description: |
            Runs on any left-side press (button 1 or 3), before the button-specific action.

            Useful for things like toggling an input_boolean "deactivate motion lights", disabling/enabling other automations, etc.
          default: [ ]
          selector:
            action: { }

        right_any_press:
          name: Right rockers - any press
          description: |
            Runs on any right-side press (button 2 or 4), before the button-specific action.

            Useful for things like toggling an input_boolean "deactivate motion lights", disabling/enabling other automations, etc.
          default: [ ]
          selector:
            action: { }

    single_click_actions:
      name: Single click actions
      collapsed: true
      input:
        left_up_1x:
          name: Left up
          description: |
            Leave empty to run the default.

            Default: activates scene "scene.'area_friendly_name'_bright" with a 1 second transition.
          default: [ ]
          selector:
            action: { }

        left_down_1x:
          name: Left down
          description: |
            Leave empty to run the default.

            Default:
            - If any light in the left area is on: turn off the lights with a 1 second transition.
            - Otherwise: activates "scene.'area_friendly_name'_dim" with a 1 second transition.
          default: [ ]
          selector:
            action: { }

        right_up_1x:
          name: Right up
          description: |
            Leave empty to run the default.

            Default: activates scene "scene.'area_friendly_name'_bright" with a 1 second transition.
          default: [ ]
          selector:
            action: { }

        right_down_1x:
          name: Right down
          description: |
            Leave empty to run the default.

            Default:
            - If any light in the right area is on: turn off the lights with a 1 second transition.
            - Otherwise: activates "scene.'area_friendly_name'_dim" with a 1 second transition.
          default: [ ]
          selector:
            action: { }

    enable_double_click:
      name: Enable double click
      description: Enables best-effort double click detection. When enabled, actions are delayed.
      default: false
      selector:
        boolean: { }

    double_click_delay_ms:
      name: Double click delay (ms)
      description: |
        Only used when double click is enabled.

        Adds this delay before running actions and also defines the maximum time between clicks for a double click.
      default: 1000
      selector:
        number:
          min: 300
          max: 2000
          step: 50
          unit_of_measurement: ms
          mode: slider

    double_click_actions:
      name: Double click actions
      collapsed: true
      input:
        left_up_2x:
          name: Left up
          description: Action for left up double click. Only used when double click is enabled.
          default: [ ]
          selector:
            action: { }

        left_down_2x:
          name: Left down
          description: Action for left down double click. Only used when double click is enabled.
          default: [ ]
          selector:
            action: { }

        right_up_2x:
          name: Right up
          description: Action for right up double click. Only used when double click is enabled.
          default: [ ]
          selector:
            action: { }

        right_down_2x:
          name: Right down
          description: Action for right down double click. Only used when double click is enabled.
          default: [ ]
          selector:
            action: { }


variables:
  switches: !input switches

  device_event_entities: >
    {{ device_entities(switches)
       | select('match', '^event\\.')
       | list }}

  left_area: !input left_area
  right_area: !input right_area

  left_area_name: "{{ (left_area | default('')) | lower | replace(' ', '_') }}"
  right_area_name: "{{ (area_name(right_area) | default('')) | lower | replace(' ', '_') }}"
  cycle_scenes: !input cycle_scenes
  scene_time_start: !input scene_time_start
  scene_time_end: !input scene_time_end
  modify_bright_scenes_by_time: !input modify_bright_scenes_by_time
  modify_dim_scenes_by_time: !input modify_dim_scenes_by_time

  enable_double_click: !input enable_double_click
  double_click_delay_ms: !input double_click_delay_ms

  left_up_1x: !input left_up_1x
  left_down_1x: !input left_down_1x
  right_up_1x: !input right_up_1x
  right_down_1x: !input right_down_1x

  left_up_2x: !input left_up_2x
  left_down_2x: !input left_down_2x
  right_up_2x: !input right_up_2x
  right_down_2x: !input right_down_2x

  any_press: !input any_press
  left_any_press: !input left_any_press
  right_any_press: !input right_any_press

trigger_variables:
  t_switches: !input switches
  first_event_entity: "{{ (device_entities(t_switches) | select('match', '^event\\.') | first) }}"
  first_event_raw: "{{ first_event_entity | string | replace('_1_pressed','') }}"
trigger:
  - platform: event
    id: "0"
    event_type: state_changed
    event_data:
      entity_id: "{{ first_event_entity }}"
  - platform: event
    id: "1"
    event_type: state_changed
    event_data:
      entity_id: "{{ first_event_entity }}_2"
  - platform: event
    id: "2"
    event_type: state_changed
    event_data:
      entity_id: "{{ first_event_entity }}_3"
  - platform: event
    id: "3"
    event_type: state_changed
    event_data:
      entity_id: "{{ first_event_entity }}_4"
  - platform: event
    id: "4"
    event_type: state_changed
    event_data:
      entity_id: "{{ first_event_raw }}_1_pressed"
  - platform: event
    id: "5"
    event_type: state_changed
    event_data:
      entity_id: "{{ first_event_raw }}_2_pressed"
  - platform: event
    id: "6"
    event_type: state_changed
    event_data:
      entity_id: "{{ first_event_raw }}_3_pressed"
  - platform: event
    id: "7"
    event_type: state_changed
    event_data:
      entity_id: "{{ first_event_raw }}_4_pressed"

condition:
  - condition: template
    value_template: >
      {% set d = trigger.event.data %}
      {% set eid = d.entity_id if d is not none else '' %}
      {% set old = d.old_state if d is not none else none %}
      {% set new = d.new_state if d is not none else none %}
      {% set event_type = new.attributes.get('event_type') if (new is not none and new.attributes is not none) else none %}

      {# Allow old_state to be unknown/unavailable only if it's been that way > 30s #}
      {% set old_state = (old.state | string) if old is not none else '' %}
      {% set new_state = (new.state | string) if new is not none else '' %}
      {% set old_is_bad = old_state in ['unknown', 'unavailable'] %}
      {% set old_last_changed_ts = as_timestamp(old.last_changed, default=none) if old is not none else none %}
      {% set old_bad_long_enough = old_is_bad and (old_last_changed_ts is number) and ((as_timestamp(now()) - old_last_changed_ts) > 30) %}
      {% set old_ok = (not old_is_bad) or old_bad_long_enough %}

      {# Several triggers can match one entity; only the first matching trigger may run #}
      {% set expected_entities = [first_event_entity, first_event_entity ~ '_2', first_event_entity ~ '_3', first_event_entity ~ '_4', first_event_raw ~ '_1_pressed', first_event_raw ~ '_2_pressed', first_event_raw ~ '_3_pressed', first_event_raw ~ '_4_pressed'] %}
      {% set is_first_trigger = eid in expected_entities and expected_entities.index(eid) == (trigger.id | int(-1)) %}
      {# Ignore duplicate event entities that report the same physical press #}
      {% set ns_dup = namespace(dup=false) %}
      {% if new is not none and eid is string %}
        {% set ts = as_timestamp(new.last_updated, default=0) %}
        {% for o in device_event_entities if o != eid and (2 if '_2' in o else 3 if '_3' in o else 4 if '_4' in o else 1) == (2 if '_2' in eid else 3 if '_3' in eid else 4 if '_4' in eid else 1) %}
          {% set od = states[o] %}
          {% set diff = ts - as_timestamp(od.last_updated, default=0) if od is not none else 999 %}
          {% if diff >= 0 and diff < 0.3 and (diff > 0 or o < eid) %}{% set ns_dup.dup = true %}{% endif %}
        {% endfor %}
      {% endif %}

      {{
        eid is string
        and eid.startswith('event.')
        and eid in device_event_entities
        and new_state not in ['unknown', 'unavailable']
        and old_ok
        and old_state != new_state
        and (event_type | string) == 'press'
        and not ns_dup.dup
        and is_first_trigger
      }}

action:
  - variables:
      triggering_entity: "{{ trigger.event.data.entity_id }}"
      button_id: >
        {% if "_2" in triggering_entity %}
          2
        {% elif "_3" in triggering_entity %}
          3
        {% elif "_4" in triggering_entity %}
          4
        {% else %}
          1
        {% endif %}

      # Be defensive: old_state/new_state can be None or have state = unknown/unavailable
      old_state_str: >
        {% set os = trigger.event.data.old_state %}
        {{ os.state if os is not none else '' }}
      new_state_str: >
        {% set ns = trigger.event.data.new_state %}
        {{ ns.state if ns is not none else '' }}

      # as_timestamp throws on bad input unless default is provided
      old_ms: "{{ (as_timestamp(old_state_str, default=0) * 1000) | int }}"
      new_ms: "{{ (as_timestamp(new_state_str, default=0) * 1000) | int }}"

      delta_ms: "{{ (new_ms - old_ms) | int }}"
      is_double: "{{ enable_double_click and delta_ms >= 1 and delta_ms <= (double_click_delay_ms | int) }}"
      selected_area: "{{ left_area if (button_id | string) in ['1', '3'] else right_area }}"
      selected_area_name: "{{ left_area_name if (button_id | string) in ['1', '3'] else right_area_name }}"
      daytime: >
        {% set now_time = now().strftime('%H:%M:%S') %}
        {% if scene_time_start <= scene_time_end %}
          {{ scene_time_start <= now_time < scene_time_end }}
        {% else %}
          {{ now_time >= scene_time_start or now_time < scene_time_end }}
        {% endif %}

  - choose:
      - conditions: "{{ enable_double_click and not is_double }}"
        sequence:
          - delay:
              milliseconds: "{{ double_click_delay_ms }}"


  # Any press actions (run before per-button actions)
  - choose:
      - conditions: "{{ any_press != [] }}"
        sequence: !input any_press
      - conditions: "{{ (button_id | string) in ['1','3'] and left_any_press != [] }}"
        sequence: !input left_any_press
      - conditions: "{{ (button_id | string) in ['2','4'] and right_any_press != [] }}"
        sequence: !input right_any_press

  # Per-button actions
  # Position on the scene ladder: dimmest -> brightest (missing scenes are skipped)
  - variables:
      scene_prefix: "scene.{{ selected_area_name }}_"
      existing_scenes: "{{ states.scene | map(attribute='entity_id') | list }}"
      dim_scenes: "{{ [scene_prefix ~ 'dimmest', scene_prefix ~ 'dimmer', scene_prefix ~ 'dim'] | select('in', existing_scenes) | list }}"
      bright_scenes: "{{ [scene_prefix ~ 'bright', scene_prefix ~ 'brighter', scene_prefix ~ 'brightest'] | select('in', existing_scenes) | list }}"
      scene_ladder: "{{ dim_scenes + bright_scenes }}"
      # A scene's state is the time it was last activated
      last_scene: >
        {% set ns = namespace(entity='', activated=0) %}
        {% for entity_id in scene_ladder %}
          {% set activated = as_timestamp(states(entity_id), default=0) %}
          {% if activated > ns.activated %}
            {% set ns.activated = activated %}
            {% set ns.entity = entity_id %}
          {% endif %}
        {% endfor %}
        {{ ns.entity }}
      lights_are_on: >
        {% set area_lights = expand(area_entities(selected_area)) | selectattr('domain', 'eq', 'light') | list if selected_area else [] %}
        {% set scene_members = expand(state_attr(last_scene, 'entity_id') or []) if last_scene else [] %}
        {{ (area_lights + scene_members) | selectattr('state', 'eq', 'on') | list | count > 0 }}
      down_off_cooldown_seconds: 0.5
      down_off_cooldown_active: >
        {% set area_lights = expand(area_entities(selected_area)) | selectattr('domain', 'eq', 'light') | list if selected_area else [] %}
        {% set scene_members = expand(state_attr(last_scene, 'entity_id') or []) if last_scene else [] %}
        {% set now_ts = as_timestamp(now()) %}
        {% set ns = namespace(active=false) %}
        {% if not lights_are_on %}
          {% for light in area_lights + scene_members %}
            {% set age = now_ts - as_timestamp(light.last_changed, default=0) %}
            {% if light.state == 'off' and age >= 0 and age < down_off_cooldown_seconds %}
              {% set ns.active = true %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.active }}
      # Only continue the ladder when the last activated scene is still on
      scene_index: "{{ scene_ladder.index(last_scene) if lights_are_on and last_scene in scene_ladder else -1 }}"
      start_up_scene: >
        {% if modify_bright_scenes_by_time and daytime %}
          {{ bright_scenes | last | default('', true) }}
        {% else %}
          {{ bright_scenes | first | default('', true) }}
        {% endif %}
      start_down_scene: >
        {% if modify_dim_scenes_by_time and not daytime %}
          {{ dim_scenes | first | default('', true) }}
        {% else %}
          {{ dim_scenes | last | default('', true) }}
        {% endif %}
      next_up_scene: >
        {% if scene_index < 0 %}
          {{ start_up_scene }}
        {% elif scene_index + 1 < scene_ladder | length %}
          {{ scene_ladder[scene_index + 1] }}
        {% else %}
          {{ bright_scenes | first | default('', true) }}
        {% endif %}
      next_down_scene: >
        {% if down_off_cooldown_active %}
        {% elif scene_index < 0 %}
          {{ start_down_scene }}
        {% elif scene_index > 0 %}
          {{ scene_ladder[scene_index - 1] }}
        {% endif %}

  - choose:
      # Left up (1)
      - conditions: "{{ (button_id | string) == '1' }}"
        sequence:
          - choose:
              # Double click: only run override if provided, otherwise do nothing (no default)
              - conditions: "{{ enable_double_click and is_double and left_up_2x != [] }}"
                sequence: !input left_up_2x
              # Single click: run override if provided, otherwise run default
              - conditions: "{{ (not enable_double_click) or (not is_double) }}"
                sequence:
                  - choose:
                      - conditions: "{{ left_up_1x != [] }}"
                        sequence: !input left_up_1x
                    default:
                      - choose:
                          - conditions: "{{ left_area is not none and cycle_scenes }}"
                            sequence:
                              - if:
                                  - condition: template
                                    value_template: "{{ next_up_scene != '' }}"
                                then:
                                  - service: scene.turn_on
                                    target:
                                      entity_id: "{{ next_up_scene }}"
                                    data:
                                      transition: 1
                        default:
                          - if:
                              - condition: template
                                value_template: "{{ left_area is not none }}"
                            then:
                              - service: scene.turn_on
                                target:
                                  entity_id: "scene.{{ left_area_name }}_bright"
                                data:
                                  transition: 1
            default: [ ]

      # Right up (2)
      - conditions: "{{ (button_id | string) == '2' }}"
        sequence:
          - choose:
              - conditions: "{{ enable_double_click and is_double and right_up_2x != [] }}"
                sequence: !input right_up_2x
              - conditions: "{{ (not enable_double_click) or (not is_double) }}"
                sequence:
                  - choose:
                      - conditions: "{{ right_up_1x != [] }}"
                        sequence: !input right_up_1x
                    default:
                      - choose:
                          - conditions: "{{ right_area is not none and cycle_scenes }}"
                            sequence:
                              - if:
                                  - condition: template
                                    value_template: "{{ next_up_scene != '' }}"
                                then:
                                  - service: scene.turn_on
                                    target:
                                      entity_id: "{{ next_up_scene }}"
                                    data:
                                      transition: 1
                        default:
                          - if:
                              - condition: template
                                value_template: "{{ right_area is not none }}"
                            then:
                              - service: scene.turn_on
                                target:
                                  entity_id: "scene.{{ right_area_name }}_bright"
                                data:
                                  transition: 1
            default: [ ]

      # Left down (3)
      - conditions: "{{ (button_id | string) == '3' }}"
        sequence:
          - choose:
              - conditions: "{{ enable_double_click and is_double and left_down_2x != [] }}"
                sequence: !input left_down_2x
              - conditions: "{{ (not enable_double_click) or (not is_double) }}"
                sequence:
                  - choose:
                      - conditions: "{{ left_down_1x != [] }}"
                        sequence: !input left_down_1x
                    default:
                      - choose:
                          - conditions: "{{ left_area is not none and cycle_scenes }}"
                            sequence:
                              - if:
                                  - condition: template
                                    value_template: "{{ next_down_scene != '' }}"
                                then:
                                  - service: scene.turn_on
                                    target:
                                      entity_id: "{{ next_down_scene }}"
                                    data:
                                      transition: 1
                                else:
                                  - service: light.turn_off
                                    target:
                                      area_id: "{{ left_area }}"
                        default:
                          - choose:
                              - conditions: "{{ left_area is not none and (expand(area_entities(left_area)) | selectattr('domain','eq','light') | selectattr('state', 'eq', 'on') | list | count > 0) }}"
                                sequence:
                                  - service: light.turn_off
                                    target:
                                      area_id: "{{ left_area }}"
                                    data:
                                      transition: 1
                            default:
                              - if:
                                  - condition: template
                                    value_template: "{{ left_area is not none }}"
                                then:
                                  - service: scene.turn_on
                                    target:
                                      entity_id: "scene.{{ left_area_name }}_dim"
                                    data:
                                      transition: 1
            default: [ ]

      # Right down (4)
      - conditions: "{{ (button_id | string) == '4' }}"
        sequence:
          - choose:
              - conditions: "{{ enable_double_click and is_double and right_down_2x != [] }}"
                sequence: !input right_down_2x
              - conditions: "{{ (not enable_double_click) or (not is_double) }}"
                sequence:
                  - choose:
                      - conditions: "{{ right_down_1x != [] }}"
                        sequence: !input right_down_1x
                    default:
                      - choose:
                          - conditions: "{{ right_area is not none and cycle_scenes }}"
                            sequence:
                              - if:
                                  - condition: template
                                    value_template: "{{ next_down_scene != '' }}"
                                then:
                                  - service: scene.turn_on
                                    target:
                                      entity_id: "{{ next_down_scene }}"
                                    data:
                                      transition: 1
                                else:
                                  - service: light.turn_off
                                    target:
                                      area_id: "{{ right_area }}"
                        default:
                          - choose:
                              - conditions: "{{ right_area is not none and (expand(area_entities(right_area)) | selectattr('domain','eq','light') | selectattr('state', 'eq', 'on') | list | count > 0) }}"
                                sequence:
                                  - service: light.turn_off
                                    target:
                                      area_id: "{{ right_area }}"
                                    data:
                                      transition: 1
                            default:
                              - if:
                                  - condition: template
                                    value_template: "{{ right_area is not none }}"
                                then:
                                  - service: scene.turn_on
                                    target:
                                      entity_id: "scene.{{ right_area_name }}_dim"
                                    data:
                                      transition: 1
            default: [ ]