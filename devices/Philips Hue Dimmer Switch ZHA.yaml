# https://gist.github.com/sandervv/f326ff3b2bcb945b5a9dc0bfb82e3308

blueprint:
  name: SGDevice - Philips Hue Dimmer Switch (ZHA)
  description: |
    Blueprint to integrate the Philips Hue Dimmer Switch (ZHA) with Home Assistant.
    Run actions on button presses.

    Enable "Cycle scenes" to use existing _bright/_brighter/_brightest and
    _dim/_dimmer/_dimmest scenes for short Up/Down presses. With that option
    disabled, the original brightness-step behavior is unchanged.
  domain: automation
  source_url: https://github.com/sondregronas/hass-blueprints/blob/main/devices/Philips%20Hue%20Dimmer%20Switch%20ZHA.yaml

  # Define the inputs for the blueprint
  input:
    remotes:
      name: Philips Hue Dimmer Switches
      description: Pick either RWL020 (US) or RWL021 (EU)
      selector:
        device:
          integration: zha
          manufacturer: Philips
          entity:
            domain: sensor
            device_class: battery
    area:
      name: Area
      description: The area to control. (Only affects default behavior)
      selector:
        area: { }

    cycle_scenes:
      name: Cycle scenes
      description: |
        When enabled, Up and Down step through the area's scenes in this order
        (missing scenes are skipped): dimmest, dimmer, dim, bright, brighter,
        brightest. Up from brightest wraps to bright, Down from dimmest turns
        the lights off. Enabled by default.
      default: true
      selector:
        boolean: { }

    scene_time_start:
      name: Scene daytime start
      description: Start of the daytime window used by the time-of-day options below.
      default: "08:00:00"
      selector:
        time: { }

    scene_time_end:
      name: Scene daytime end
      description: End of the daytime window used by the time-of-day options below.
      default: "21:00:00"
      selector:
        time: { }

    modify_bright_scenes_by_time:
      name: Modify bright scenes based on time of day
      description: When Up starts a cycle (lights off or no scene active), start at Brightest during the daytime window instead of Bright.
      default: false
      selector:
        boolean: { }

    modify_dim_scenes_by_time:
      name: Modify dim scenes based on time of day
      description: When Down starts a cycle (lights off or no scene active), start at Dimmest outside the daytime window instead of Dim.
      default: true
      selector:
        boolean: { }

    optional_action:
      name: Any button pressed action
      description: An optional action to run before the button press actions. (e.g. turn off lights when motion is detected)
      default:
      selector:
        action: { }

    button_on_short_press:
      name: On button short press
      description: By default every light in the area will be turned on.
      default: [ ]
      selector:
        action:
    button_on_double_press:
      name: On button double press
      description: By default `scene.<area_name>_bright` will be activated.
      default: [ ]
      selector:
        action:
    button_on_long_press:
      name: On button long press
      description: By default every light in the area will get a random color. (Only affects lights with color support)
      default: [ ]
      selector:
        action:

    button_up_short_press:
      name: Up button short press
      description: By default every light in the area will get 15% brighter.
      default: [ ]
      selector:
        action:
    button_up_double_press:
      name: Up button double press
      # description:
      default: [ ]
      selector:
        action:
    button_up_long_press:
      name: Up button long press
      # description:
      default: [ ]
      selector:
        action:

    button_down_short_press:
      name: Down button short press
      description: By default every light in the area will get 15% dimmer.
      default: [ ]
      selector:
        action:
    button_down_double_press:
      name: Down button double press
      # description:
      default: [ ]
      selector:
        action:
    button_down_long_press:
      name: Down button long press
      # description:
      default: [ ]
      selector:
        action:

    button_off_short_press:
      name: Off button short press
      description: By default every light in the area will be turned off.
      default: [ ]
      selector:
        action:
    button_off_double_press:
      name: Off button double press
      description: By default `scene.<area_name>_dim` will be activated.
      default: [ ]
      selector:
        action:
    button_off_long_press:
      name: Off button long press
      # description:
      default: [ ]
      selector:
        action:

mode: queued
max_exceeded: silent

variables:
  remotes: !input remotes

  area: !input area
  area_name: "{{ area | lower | replace(' ', '_') }}"
  light_entities: "{{ expand(area_entities(area)) | selectattr('domain', 'eq', 'light') | map(attribute='entity_id') | list }}"
  light_entities_with_hs_color: "{{ expand(light_entities) | selectattr('attributes.hs_color', 'defined') | map(attribute='entity_id') | list }}"
  cycle_scenes: !input cycle_scenes
  scene_time_start: !input scene_time_start
  scene_time_end: !input scene_time_end
  modify_bright_scenes_by_time: !input modify_bright_scenes_by_time
  modify_dim_scenes_by_time: !input modify_dim_scenes_by_time

  optional_action: !input optional_action

  button_on_short_press: !input button_on_short_press
  button_on_long_press: !input button_on_long_press
  button_on_double_press: !input button_on_double_press
  button_up_short_press: !input button_up_short_press
  button_up_long_press: !input button_up_long_press
  button_up_double_press: !input button_up_double_press
  button_down_short_press: !input button_down_short_press
  button_down_long_press: !input button_down_long_press
  button_down_double_press: !input button_down_double_press
  button_off_short_press: !input button_off_short_press
  button_off_long_press: !input button_off_long_press
  button_off_double_press: !input button_off_double_press

trigger_variables:
  t_remote: !input remotes

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: "{{ t_remote }}"

condition: [ ]

action:
  - variables:
      command: '{{ trigger.event.data.command }}'
      daytime: >
        {% set now_time = now().strftime('%H:%M:%S') %}
        {% if scene_time_start <= scene_time_end %}
          {{ scene_time_start <= now_time < scene_time_end }}
        {% else %}
          {{ now_time >= scene_time_start or now_time < scene_time_end }}
        {% endif %}

  - choose:
      - conditions: "{{ optional_action != [] }}"
        sequence: !input optional_action

  # Position on the scene ladder: dimmest -> brightest (missing scenes are skipped)
  - variables:
      scene_prefix: "scene.{{ area_name }}_"
      existing_scenes: "{{ states.scene | map(attribute='entity_id') | list }}"
      dim_scenes: "{{ [scene_prefix ~ 'dimmest', scene_prefix ~ 'dimmer', scene_prefix ~ 'dim'] | select('in', existing_scenes) | list }}"
      bright_scenes: "{{ [scene_prefix ~ 'bright', scene_prefix ~ 'brighter', scene_prefix ~ 'brightest'] | select('in', existing_scenes) | list }}"
      scene_ladder: "{{ dim_scenes + bright_scenes }}"
      # A scene's state is the time it was last activated
      last_scene: >
        {% set ns = namespace(entity='', activated=0) %}
        {% for entity_id in scene_ladder %}
          {% set activated = as_timestamp(states(entity_id), default=0) %}
          {% if activated > ns.activated %}
            {% set ns.activated = activated %}
            {% set ns.entity = entity_id %}
          {% endif %}
        {% endfor %}
        {{ ns.entity }}
      lights_are_on: >
        {% set area_lights = expand(light_entities) %}
        {% set scene_members = expand(state_attr(last_scene, 'entity_id') or []) if last_scene else [] %}
        {{ (area_lights + scene_members) | selectattr('state', 'eq', 'on') | list | count > 0 }}
      down_off_cooldown_seconds: 0.5
      down_off_cooldown_active: >
        {% set area_lights = expand(light_entities) %}
        {% set scene_members = expand(state_attr(last_scene, 'entity_id') or []) if last_scene else [] %}
        {% set now_ts = as_timestamp(now()) %}
        {% set ns = namespace(active=false) %}
        {% if not lights_are_on %}
          {% for light in area_lights + scene_members %}
            {% set age = now_ts - as_timestamp(light.last_changed, default=0) %}
            {% if light.state == 'off' and age >= 0 and age < down_off_cooldown_seconds %}
              {% set ns.active = true %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.active }}
      # Only continue the ladder when the last activated scene is still on
      scene_index: "{{ scene_ladder.index(last_scene) if lights_are_on and last_scene in scene_ladder else -1 }}"
      start_up_scene: >
        {% if modify_bright_scenes_by_time and daytime %}
          {{ bright_scenes | last | default('', true) }}
        {% else %}
          {{ bright_scenes | first | default('', true) }}
        {% endif %}
      start_down_scene: >
        {% if modify_dim_scenes_by_time and not daytime %}
          {{ dim_scenes | first | default('', true) }}
        {% else %}
          {{ dim_scenes | last | default('', true) }}
        {% endif %}
      next_up_scene: >
        {% if scene_index < 0 %}
          {{ start_up_scene }}
        {% elif scene_index + 1 < scene_ladder | length %}
          {{ scene_ladder[scene_index + 1] }}
        {% else %}
          {{ bright_scenes | first | default('', true) }}
        {% endif %}
      next_down_scene: >
        {% if down_off_cooldown_active %}
        {% elif scene_index < 0 %}
          {{ start_down_scene }}
        {% elif scene_index > 0 %}
          {{ scene_ladder[scene_index - 1] }}
        {% endif %}

  - choose:
      # ON
      ##############################

      # Turn on all lights in the area
      - conditions: '{{ command == ''on_press'' }}'
        sequence:
          - choose:
              - conditions: "{{ button_on_short_press != [] }}"
                sequence: !input button_on_short_press
            default:
              sequence:
                - service: light.turn_on
                  target:
                    area_id: "{{ area_name }}"

      # Activate scene <area_name>_bright
      - conditions: '{{ command == ''on_double_press'' }}'
        sequence:
          - choose:
              - conditions: "{{ button_on_double_press != [] }}"
                sequence: !input button_on_double_press
            default:
              - service: scene.turn_on
                target:
                  entity_id: scene.{{ area_name }}_bright

      # Set every light with color support to a random color
      - conditions: '{{ command == ''on_hold'' }}'
        sequence:
          - choose:
              - conditions: "{{ button_on_long_press != [] }}"
                sequence: !input button_on_long_press
            default:
              - repeat:
                  for_each: "{{ light_entities_with_hs_color }}"
                  sequence:
                    - service: light.turn_on
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        hs_color:
                          - "{{ range(0, 360) | random }}"
                          - 100

      # OFF
      ##############################

      # Turn off all lights
      - conditions: '{{ command == ''off_press'' }}'
        sequence:
          - choose:
              - conditions: "{{ button_off_short_press != [] }}"
                sequence: !input button_off_short_press
            default:
              sequence:
                - service: light.turn_off
                  target:
                    area_id: "{{ area_name }}"

      # Activate scene <area_name>_dim
      - conditions: '{{ command == ''off_double_press'' }}'
        sequence:
          - choose:
              - conditions: "{{ button_off_double_press != [] }}"
                sequence: !input button_off_double_press
            default:
              - service: scene.turn_on
                target:
                  entity_id: scene.{{ area_name }}_dim

      - conditions: '{{ command == ''off_hold'' }}'
        sequence: !input button_off_long_press

      # UP
      ##############################

      # Add 15% brightness to all lights
      - conditions: '{{ command == ''up_press'' }}'
        sequence:
          - choose:
              - conditions: "{{ button_up_short_press != [] }}"
                sequence: !input button_up_short_press
              - conditions: "{{ cycle_scenes }}"
                sequence:
                  - if:
                      - condition: template
                        value_template: "{{ next_up_scene != '' }}"
                    then:
                      - service: scene.turn_on
                        target:
                          entity_id: "{{ next_up_scene }}"
                        data:
                          transition: 1
            default:
              - repeat:
                  for_each: "{{ light_entities }}"
                  sequence:
                    - service: light.turn_on
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        brightness_step_pct: 15

      - conditions: '{{ command == ''up_double_press'' }}'
        sequence: !input button_up_double_press

      - conditions: '{{ command == ''up_hold'' }}'
        sequence: !input button_up_long_press

      # DOWN
      ##############################

      # Subtract 15% brightness from all lights
      - conditions: '{{ command == ''down_press'' }}'
        sequence:
          - choose:
              - conditions: "{{ button_down_short_press != [] }}"
                sequence: !input button_down_short_press
              - conditions: "{{ cycle_scenes }}"
                sequence:
                  - if:
                      - condition: template
                        value_template: "{{ next_down_scene != '' }}"
                    then:
                      - service: scene.turn_on
                        target:
                          entity_id: "{{ next_down_scene }}"
                        data:
                          transition: 1
                    else:
                      - service: light.turn_off
                        target:
                          area_id: "{{ area_name }}"
            default:
              - repeat:
                  for_each: "{{ light_entities }}"
                  sequence:
                    - service: light.turn_on
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        brightness_step_pct: -15

      - conditions: '{{ command == ''down_double_press'' }}'
        sequence: !input button_down_double_press

      - conditions: '{{ command == ''down_hold'' }}'
        sequence: !input button_down_long_press
