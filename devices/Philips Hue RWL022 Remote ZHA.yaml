blueprint:
  name: SGDevice - Philips Hue RWL022 Remote (ZHA)
  description: |
    Blueprint to integrate the Philips Hue RWL022 Dimmer Switch with Home Assistant via ZHA.

    Button mapping (ZHA commands):
      - On button: fires "on" (some firmwares/devices may also emit "off_with_effect"; treated the same by default)
      - Brightness Up: fires "step" with step_mode Up (repeats every 1s while held)
      - Brightness Down: fires "step" with step_mode Down (repeats every 1s while held)
      - Off button (Hue): fires "recall" command

    Default behavior (when no override action is provided):
      - On: activates scene "scene.'area_friendly_name'_bright" (1s transition)
      - Up: activates the bright scene, or cycles bright scenes when enabled
      - Down: turns off lights or activates the dim scene, then cycles dim scenes when enabled
      - Off: if any light in that area is on, turn off lights; otherwise activates "scene.'area_friendly_name'_dim" (1s transition)

    Any press action:
      - You can run an extra action on any button press, before the button-specific actions.
      - Useful for things like toggling an input_boolean "deactivate motion lights", disabling/enabling other automations, etc.

    Note: This blueprint relies on ZHA integration events.

  domain: automation
  source_url: https://github.com/sondregronas/hass-blueprints/blob/main/devices/Philips%20Hue%20RWL022%20Remote%20ZHA.yaml

  input:
    remote:
      name: Philips Hue RWL022 Remote
      description: Select the Philips Hue RWL022 Dimmer Switch device.
      selector:
        device:
          integration: zha
          manufacturer: Signify Netherlands B.V.
          entity:
            domain: sensor
            device_class: battery

    area:
      name: Area (optional)
      description: Area used by default actions (uses the area friendly name for scene names).
      default: null
      selector:
        area: { }

    brightness_step:
      name: Brightness step (%)
      description: |
        Percentage to increase/decrease brightness when pressing up/down buttons.
        Used by the default up/down actions.
      default: 20
      selector:
        number:
          min: 1
          max: 50
          step: 1
          unit_of_measurement: "%"
          mode: slider

    cycle_scenes:
      name: Cycle scenes
      description: |
        When enabled, Up and Down use the area's bright/dim scenes instead of
        changing brightness directly. Enabled mode cycles bright scenes upward
        and dim scenes downward, wrapping at both ends. Enabled by default.
      default: true
      selector:
        boolean: { }

    scene_time_start:
      name: Scene daytime start
      description: Preferred brightest/dim scenes are used from this time.
      default: "10:00:00"
      selector:
        time: { }

    scene_time_end:
      name: Scene daytime end
      description: Preferred brightest/dim scenes are used until this time.
      default: "21:00:00"
      selector:
        time: { }

    any_press_action:
      name: Any press action
      description: |
        Runs on any button press, before the button-specific actions.

        Useful for things like toggling an input_boolean "deactivate motion lights", disabling/enabling other automations, etc.
      default: [ ]
      selector:
        action: { }

    button_actions:
      name: Button actions
      collapsed: true
      input:
        on_action:
          name: On button
          description: |
            Leave empty to run the default.

            Default: activates scene "scene.'area_friendly_name'_bright" with a 1 second transition.
          default: [ ]
          selector:
            action: { }

        up_action:
          name: Up button
          description: |
            Leave empty to run the default.

            Default: increases brightness by step percentage with 1.1 second transition.
            
            Note: Fires repeatedly every 1 second while holding the button, with the same parameters
          default: [ ]
          selector:
            action: { }

        down_action:
          name: Down button
          description: |
            Leave empty to run the default.

            Default: decreases brightness by step percentage with 1.1 second transition.
            
            Note: Fires repeatedly every 1 second while holding the button, with the same parameters
          default: [ ]
          selector:
            action: { }

        off_action:
          name: Off button (Hue)
          description: |
            Leave empty to run the default.

            Default:
            - If any light in the area is on: turn off the lights with a 1 second transition.
            - Otherwise: activates "scene.'area_friendly_name'_dim" with a 1 second transition.
          default: [ ]
          selector:
            action: { }

mode: restart
max_exceeded: silent

variables:
  remote: !input remote

  area: !input area
  area_name: "{{ (area_name(area) | default('')) | lower | replace(' ', '_') }}"
  light_entities: "{{ expand(area_entities(area)) | selectattr('domain', 'eq', 'light') | map(attribute='entity_id') | list if area else [] }}"

  brightness_step: !input brightness_step
  cycle_scenes: !input cycle_scenes
  scene_time_start: !input scene_time_start
  scene_time_end: !input scene_time_end

  any_press_action: !input any_press_action

  on_action: !input on_action
  up_action: !input up_action
  down_action: !input down_action
  off_action: !input off_action

trigger_variables:
  t_remote: !input remote

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: "{{ t_remote }}"

condition: [ ]

action:
  - variables:
      command: "{{ trigger.event.data.command }}"
      raw_params: "{{ trigger.event.data.params }}"
      raw_args: "{{ trigger.event.data.args }}"
      lights_are_on: "{{ expand(light_entities) | selectattr('state', 'eq', 'on') | list | count > 0 }}"
      daytime: >
        {% set now_time = now().strftime('%H:%M:%S') %}
        {% if scene_time_start <= scene_time_end %}
          {{ scene_time_start <= now_time < scene_time_end }}
        {% else %}
          {{ now_time >= scene_time_start or now_time < scene_time_end }}
        {% endif %}
      scene_entities: >
        {{ states.scene
          | selectattr('entity_id', 'in', [
              'scene.' ~ area_name ~ '_bright',
              'scene.' ~ area_name ~ '_brighter',
              'scene.' ~ area_name ~ '_brightest',
              'scene.' ~ area_name ~ '_dim',
              'scene.' ~ area_name ~ '_dimmer',
              'scene.' ~ area_name ~ '_dimmest'
            ])
          | map(attribute='entity_id')
          | list }}
      last_scene: >
        {{ (states.scene
          | selectattr('entity_id', 'in', scene_entities)
          | sort(attribute='last_updated')
          | map(attribute='entity_id')
          | list
          | last)
          | default('', true) }}
      step_mode: >
        {% set p = trigger.event.data.params %}
        {% set a = trigger.event.data.args %}
        {% if p is mapping and p.step_mode is defined %}
          {{ p.step_mode | string }}
        {% elif a is iterable and a | length > 0 %}
          {{ a[0] | string }}
        {% else %}
        
        {% endif %}

  # Any press action (run before per-button actions)
  - choose:
      - conditions: "{{ any_press_action != [] }}"
        sequence: !input any_press_action

  - choose:
      # On button (fires "on" or "off" command, both treated as on)
      - conditions: "{{ command in ['on', 'off_with_effect'] }}"
        sequence:
          - choose:
              - conditions: "{{ on_action != [] }}"
                sequence: !input on_action
            default:
              - if:
                  - condition: template
                    value_template: "{{ area is not none }}"
                then:
                  - service: scene.turn_on
                    target:
                      entity_id: "scene.{{ area_name }}_bright"
                    data:
                      transition: 1

      # Up button (step with step_mode Up)
      - conditions: "{{ command == 'step' and 'Up' in (step_mode | string) }}"
        sequence:
          - choose:
              - conditions: "{{ up_action != [] }}"
                sequence: !input up_action
            default:
              - if:
                  - condition: template
                    value_template: "{{ area is not none }}"
                then:
                  - choose:
                      - conditions: "{{ cycle_scenes }}"
                        sequence:
                          - variables:
                              bright_scenes: >
                                {{ [
                                  'scene.' ~ area_name ~ '_bright',
                                  'scene.' ~ area_name ~ '_brighter',
                                  'scene.' ~ area_name ~ '_brightest'
                                ] | select('in', scene_entities) | list }}
                              preferred_scene: >
                                {% if daytime %}
                                  {{ 'scene.' ~ area_name ~ '_brightest' }}
                                {% else %}
                                  {{ 'scene.' ~ area_name ~ '_bright' }}
                                {% endif %}
                              next_scene: >
                                {% set current = bright_scenes.index(last_scene) if last_scene in bright_scenes else -1 %}
                                {% if not lights_are_on %}
                                  {{ bright_scenes[0] if bright_scenes else '' }}
                                {% elif current >= 0 %}
                                  {{ bright_scenes[(current + 1) % (bright_scenes | length)] }}
                                {% elif preferred_scene in bright_scenes %}
                                  {{ preferred_scene }}
                                {% else %}
                                  {{ bright_scenes[-1] if bright_scenes and daytime else bright_scenes[0] if bright_scenes else '' }}
                                {% endif %}
                          - if:
                              - condition: template
                                value_template: "{{ next_scene != '' }}"
                            then:
                              - service: scene.turn_on
                                target:
                                  entity_id: "{{ next_scene }}"
                                data:
                                  transition: 1
                    default:
                      - service: scene.turn_on
                        target:
                          entity_id: "scene.{{ area_name }}_bright"
                        data:
                          transition: 1

      # Down button (step with step_mode Down)
      - conditions: "{{ command == 'step' and 'Down' in (step_mode | string) }}"
        sequence:
          - choose:
              - conditions: "{{ down_action != [] }}"
                sequence: !input down_action
            default:
              - if:
                  - condition: template
                    value_template: "{{ area is not none }}"
                then:
                  - choose:
                      - conditions: "{{ cycle_scenes }}"
                        sequence:
                          - variables:
                              dim_scenes: >
                                {{ [
                                  'scene.' ~ area_name ~ '_dim',
                                  'scene.' ~ area_name ~ '_dimmer',
                                  'scene.' ~ area_name ~ '_dimmest'
                                ] | select('in', scene_entities) | list }}
                              preferred_scene: >
                                {% if daytime %}
                                  {{ 'scene.' ~ area_name ~ '_dim' }}
                                {% else %}
                                  {{ 'scene.' ~ area_name ~ '_dimmer' }}
                                {% endif %}
                              next_scene: >
                                {% set current = dim_scenes.index(last_scene) if last_scene in dim_scenes else -1 %}
                                {% if not lights_are_on %}
                                  {{ dim_scenes[0] if dim_scenes else '' }}
                                {% elif current >= 0 %}
                                  {{ dim_scenes[current + 1] if current + 1 < (dim_scenes | length) else '' }}
                                {% elif preferred_scene in dim_scenes %}
                                  {{ preferred_scene }}
                                {% else %}
                                  {{ dim_scenes[0] if dim_scenes and daytime else dim_scenes[-1] if dim_scenes else '' }}
                                {% endif %}
                          - if:
                              - condition: template
                                value_template: "{{ next_scene != '' }}"
                            then:
                              - service: scene.turn_on
                                target:
                                  entity_id: "{{ next_scene }}"
                                data:
                                  transition: 1
                            else:
                              - service: light.turn_off
                                target:
                                  area_id: "{{ area_name }}"
                    default:
                      - choose:
                          - conditions: "{{ lights_are_on }}"
                            sequence:
                              - service: light.turn_off
                                target:
                                  area_id: "{{ area }}"
                                data:
                                  transition: 1
                        default:
                          - service: scene.turn_on
                            target:
                              entity_id: "scene.{{ area_name }}_dim"
                            data:
                              transition: 1

      # Off button (Hue button - fires "recall" command)
      - conditions: "{{ command == 'recall' }}"
        sequence:
          - choose:
              - conditions: "{{ off_action != [] }}"
                sequence: !input off_action
            default:
              - choose:
                  - conditions: "{{ area is not none and (expand(area_entities(area)) | selectattr('domain','eq','light') | selectattr('state', 'eq', 'on') | list | count > 0) }}"
                    sequence:
                      - service: light.turn_off
                        target:
                          area_id: "{{ area }}"
                        data:
                          transition: 1
                default:
                  - if:
                      - condition: template
                        value_template: "{{ area is not none }}"
                    then:
                      - service: scene.turn_on
                        target:
                          entity_id: "scene.{{ area_name }}_dim"
                        data:
                          transition: 1
