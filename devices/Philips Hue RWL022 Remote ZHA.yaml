blueprint:
  name: SGDevice - Philips Hue RWL022 Remote (ZHA)
  description: |
    Blueprint to integrate the Philips Hue RWL022 Dimmer Switch with Home Assistant via ZHA.

    Button mapping (ZHA commands):
      - On button: fires "on" (some firmwares/devices may also emit "off_with_effect"; treated the same by default)
      - Brightness Up: fires "step" with step_mode Up (repeats every 1s while held)
      - Brightness Down: fires "step" with step_mode Down (repeats every 1s while held)
      - Off button (Hue): fires "recall" command

    Default behavior (when no override action is provided):
      - On: activates scene "scene.'area_friendly_name'_bright" (1s transition)
      - Up: steps one scene up (dimmest -> brightest), starting at the bright scene when off
      - Down: steps one scene down (brightest -> dimmest), starting at the dim scene when off, then turns off
      - Off: if any light in that area is on, turn off lights; otherwise activates "scene.'area_friendly_name'_dim" (1s transition)

    Any press action:
      - You can run an extra action on any button press, before the button-specific actions.
      - Useful for things like toggling an input_boolean "deactivate motion lights", disabling/enabling other automations, etc.

    Note: This blueprint relies on ZHA integration events.

  domain: automation
  source_url: https://github.com/sondregronas/hass-blueprints/blob/main/devices/Philips%20Hue%20RWL022%20Remote%20ZHA.yaml

  input:
    remote:
      name: Philips Hue RWL022 Remote
      description: Select the Philips Hue RWL022 Dimmer Switch device.
      selector:
        device:
          integration: zha
          manufacturer: Signify Netherlands B.V.
          entity:
            domain: sensor
            device_class: battery

    area:
      name: Area (optional)
      description: Area used by default actions (uses the area friendly name for scene names).
      default: null
      selector:
        area: { }

    brightness_step:
      name: Brightness step (%)
      description: |
        Percentage to increase/decrease brightness when pressing up/down buttons.
        Used by the default up/down actions.
      default: 20
      selector:
        number:
          min: 1
          max: 50
          step: 1
          unit_of_measurement: "%"
          mode: slider

    cycle_scenes:
      name: Cycle scenes
      description: |
        When enabled, Up and Down step through the area's scenes in this order
        (missing scenes are skipped): dimmest, dimmer, dim, bright, brighter,
        brightest. Up from brightest wraps to bright, Down from dimmest turns
        the lights off. Enabled by default.
      default: true
      selector:
        boolean: { }

    scene_time_start:
      name: Scene daytime start
      description: Start of the daytime window used by the time-of-day options below.
      default: "08:00:00"
      selector:
        time: { }

    scene_time_end:
      name: Scene daytime end
      description: End of the daytime window used by the time-of-day options below.
      default: "21:00:00"
      selector:
        time: { }

    modify_bright_scenes_by_time:
      name: Modify bright scenes based on time of day
      description: When Up starts a cycle (lights off or no scene active), start at Brightest during the daytime window instead of Bright.
      default: false
      selector:
        boolean: { }

    modify_dim_scenes_by_time:
      name: Modify dim scenes based on time of day
      description: When Down starts a cycle (lights off or no scene active), start at Dimmest outside the daytime window instead of Dim.
      default: true
      selector:
        boolean: { }

    any_press_action:
      name: Any press action
      description: |
        Runs on any button press, before the button-specific actions.

        Useful for things like toggling an input_boolean "deactivate motion lights", disabling/enabling other automations, etc.
      default: [ ]
      selector:
        action: { }

    button_actions:
      name: Button actions
      collapsed: true
      input:
        on_action:
          name: On button
          description: |
            Leave empty to run the default.

            Default: activates scene "scene.'area_friendly_name'_bright" with a 1 second transition.
          default: [ ]
          selector:
            action: { }

        up_action:
          name: Up button
          description: |
            Leave empty to run the default.

            Default: increases brightness by step percentage with 1.1 second transition.
            
            Note: Fires repeatedly every 1 second while holding the button, with the same parameters
          default: [ ]
          selector:
            action: { }

        down_action:
          name: Down button
          description: |
            Leave empty to run the default.

            Default: decreases brightness by step percentage with 1.1 second transition.
            
            Note: Fires repeatedly every 1 second while holding the button, with the same parameters
          default: [ ]
          selector:
            action: { }

        off_action:
          name: Off button (Hue)
          description: |
            Leave empty to run the default.

            Default:
            - If any light in the area is on: turn off the lights with a 1 second transition.
            - Otherwise: activates "scene.'area_friendly_name'_dim" with a 1 second transition.
          default: [ ]
          selector:
            action: { }

mode: restart
max_exceeded: silent

variables:
  remote: !input remote

  area: !input area
  area_name: "{{ (area_name(area) | default('')) | lower | replace(' ', '_') }}"
  light_entities: "{{ expand(area_entities(area)) | selectattr('domain', 'eq', 'light') | map(attribute='entity_id') | list if area else [] }}"

  brightness_step: !input brightness_step
  cycle_scenes: !input cycle_scenes
  scene_time_start: !input scene_time_start
  scene_time_end: !input scene_time_end
  modify_bright_scenes_by_time: !input modify_bright_scenes_by_time
  modify_dim_scenes_by_time: !input modify_dim_scenes_by_time

  any_press_action: !input any_press_action

  on_action: !input on_action
  up_action: !input up_action
  down_action: !input down_action
  off_action: !input off_action

trigger_variables:
  t_remote: !input remote

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: "{{ t_remote }}"

condition: [ ]

action:
  - variables:
      command: "{{ trigger.event.data.command }}"
      raw_params: "{{ trigger.event.data.params }}"
      raw_args: "{{ trigger.event.data.args }}"
      daytime: >
        {% set now_time = now().strftime('%H:%M:%S') %}
        {% if scene_time_start <= scene_time_end %}
          {{ scene_time_start <= now_time < scene_time_end }}
        {% else %}
          {{ now_time >= scene_time_start or now_time < scene_time_end }}
        {% endif %}
      step_mode: >
        {% set p = trigger.event.data.params %}
        {% set a = trigger.event.data.args %}
        {% if p is mapping and p.step_mode is defined %}
          {{ p.step_mode | string }}
        {% elif a is iterable and a | length > 0 %}
          {{ a[0] | string }}
        {% else %}
        
        {% endif %}

  # Any press action (run before per-button actions)
  - choose:
      - conditions: "{{ any_press_action != [] }}"
        sequence: !input any_press_action

  # Position on the scene ladder: dimmest -> brightest (missing scenes are skipped)
  - variables:
      scene_prefix: "scene.{{ area_name }}_"
      existing_scenes: "{{ states.scene | map(attribute='entity_id') | list }}"
      dim_scenes: "{{ [scene_prefix ~ 'dimmest', scene_prefix ~ 'dimmer', scene_prefix ~ 'dim'] | select('in', existing_scenes) | list }}"
      bright_scenes: "{{ [scene_prefix ~ 'bright', scene_prefix ~ 'brighter', scene_prefix ~ 'brightest'] | select('in', existing_scenes) | list }}"
      scene_ladder: "{{ dim_scenes + bright_scenes }}"
      # A scene's state is the time it was last activated
      last_scene: >
        {% set ns = namespace(entity='', activated=0) %}
        {% for entity_id in scene_ladder %}
          {% set activated = as_timestamp(states(entity_id), default=0) %}
          {% if activated > ns.activated %}
            {% set ns.activated = activated %}
            {% set ns.entity = entity_id %}
          {% endif %}
        {% endfor %}
        {{ ns.entity }}
      lights_are_on: >
        {% set area_lights = expand(light_entities) %}
        {% set scene_members = expand(state_attr(last_scene, 'entity_id') or []) if last_scene else [] %}
        {{ (area_lights + scene_members) | selectattr('state', 'eq', 'on') | list | count > 0 }}
      down_off_cooldown_seconds: 0.5
      down_off_cooldown_active: >
        {% set area_lights = expand(light_entities) %}
        {% set scene_members = expand(state_attr(last_scene, 'entity_id') or []) if last_scene else [] %}
        {% set now_ts = as_timestamp(now()) %}
        {% set ns = namespace(active=false) %}
        {% if not lights_are_on %}
          {% for light in area_lights + scene_members %}
            {% set age = now_ts - as_timestamp(light.last_changed, default=0) %}
            {% if light.state == 'off' and age >= 0 and age < down_off_cooldown_seconds %}
              {% set ns.active = true %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.active }}
      # Only continue the ladder when the last activated scene is still on
      scene_index: "{{ scene_ladder.index(last_scene) if lights_are_on and last_scene in scene_ladder else -1 }}"
      start_up_scene: >
        {% if modify_bright_scenes_by_time and daytime %}
          {{ bright_scenes | last | default('', true) }}
        {% else %}
          {{ bright_scenes | first | default('', true) }}
        {% endif %}
      start_down_scene: >
        {% if modify_dim_scenes_by_time and not daytime %}
          {{ dim_scenes | first | default('', true) }}
        {% else %}
          {{ dim_scenes | last | default('', true) }}
        {% endif %}
      next_up_scene: >
        {% if scene_index < 0 %}
          {{ start_up_scene }}
        {% elif scene_index + 1 < scene_ladder | length %}
          {{ scene_ladder[scene_index + 1] }}
        {% else %}
          {{ bright_scenes | first | default('', true) }}
        {% endif %}
      next_down_scene: >
        {% if down_off_cooldown_active %}
        {% elif scene_index < 0 %}
          {{ start_down_scene }}
        {% elif scene_index > 0 %}
          {{ scene_ladder[scene_index - 1] }}
        {% endif %}

  - choose:
      # On button (fires "on" or "off" command, both treated as on)
      - conditions: "{{ command in ['on', 'off_with_effect'] }}"
        sequence:
          - choose:
              - conditions: "{{ on_action != [] }}"
                sequence: !input on_action
            default:
              - if:
                  - condition: template
                    value_template: "{{ area is not none }}"
                then:
                  - service: scene.turn_on
                    target:
                      entity_id: "scene.{{ area_name }}_bright"
                    data:
                      transition: 1

      # Up button (step with step_mode Up)
      - conditions: "{{ command == 'step' and 'Up' in (step_mode | string) }}"
        sequence:
          - choose:
              - conditions: "{{ up_action != [] }}"
                sequence: !input up_action
            default:
              - if:
                  - condition: template
                    value_template: "{{ area is not none }}"
                then:
                  - choose:
                      - conditions: "{{ cycle_scenes }}"
                        sequence:
                          - if:
                              - condition: template
                                value_template: "{{ next_up_scene != '' }}"
                            then:
                              - service: scene.turn_on
                                target:
                                  entity_id: "{{ next_up_scene }}"
                                data:
                                  transition: 1
                    default:
                      - service: scene.turn_on
                        target:
                          entity_id: "scene.{{ area_name }}_bright"
                        data:
                          transition: 1

      # Down button (step with step_mode Down)
      - conditions: "{{ command == 'step' and 'Down' in (step_mode | string) }}"
        sequence:
          - choose:
              - conditions: "{{ down_action != [] }}"
                sequence: !input down_action
            default:
              - if:
                  - condition: template
                    value_template: "{{ area is not none }}"
                then:
                  - choose:
                      - conditions: "{{ cycle_scenes }}"
                        sequence:
                          - if:
                              - condition: template
                                value_template: "{{ next_down_scene != '' }}"
                            then:
                              - service: scene.turn_on
                                target:
                                  entity_id: "{{ next_down_scene }}"
                                data:
                                  transition: 1
                            else:
                              - service: light.turn_off
                                target:
                                  area_id: "{{ area_name }}"
                    default:
                      - choose:
                          - conditions: "{{ lights_are_on }}"
                            sequence:
                              - service: light.turn_off
                                target:
                                  area_id: "{{ area }}"
                                data:
                                  transition: 1
                        default:
                          - service: scene.turn_on
                            target:
                              entity_id: "scene.{{ area_name }}_dim"
                            data:
                              transition: 1

      # Off button (Hue button - fires "recall" command)
      - conditions: "{{ command == 'recall' }}"
        sequence:
          - choose:
              - conditions: "{{ off_action != [] }}"
                sequence: !input off_action
            default:
              - choose:
                  - conditions: "{{ area is not none and (expand(area_entities(area)) | selectattr('domain','eq','light') | selectattr('state', 'eq', 'on') | list | count > 0) }}"
                    sequence:
                      - service: light.turn_off
                        target:
                          area_id: "{{ area }}"
                        data:
                          transition: 1
                default:
                  - if:
                      - condition: template
                        value_template: "{{ area is not none }}"
                    then:
                      - service: scene.turn_on
                        target:
                          entity_id: "scene.{{ area_name }}_dim"
                        data:
                          transition: 1
